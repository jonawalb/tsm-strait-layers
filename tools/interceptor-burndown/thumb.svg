  </g>
  <text x="378" y="104" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#b3261e">Dry day</text>
  <text x="70" y="352" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#033303">Interceptor burn-down</text>
