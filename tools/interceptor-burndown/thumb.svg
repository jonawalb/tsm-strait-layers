  <g stroke="#e3e3da" stroke-width="1">
    <line x1="70" y1="90" x2="590" y2="90"/><line x1="70" y1="160" x2="590" y2="160"/>
    <line x1="70" y1="230" x2="590" y2="230"/><line x1="70" y1="300" x2="590" y2="300"/>
